# Development Environment Configuration

# Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/kasisira_dev
spring.datasource.username=${DEV_DB_USERNAME}
spring.datasource.password=${DEV_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
# ddl-auto is set to validate in application.properties; Flyway owns the schema.
# SQL logging is off by default to keep dev logs readable. Flip to true +
# uncomment the two logging.level lines below when debugging a specific query.
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Flyway configuration inherited from application.properties.

# Logging
logging.level.root=INFO
logging.level.com.mudhut.software.kasisira=DEBUG
logging.level.org.springframework.web=DEBUG
#logging.level.org.hibernate.SQL=DEBUG
#logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Actuator
management.endpoints.web.exposure.include=health,info,metrics

# DevTools
spring.devtools.restart.enabled=true
