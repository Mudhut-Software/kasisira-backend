# Base Application Configuration
spring.application.name=kasisira

# Active Profile - Set via environment variable or JVM argument
# Example: java -jar -Dspring.profiles.active=production app.jar
# Or: export SPRING_PROFILES_ACTIVE=development
spring.profiles.active=${SPRING_PROFILES_ACTIVE:development}

# Common settings across all environments
server.servlet.context-path=/api

# Jackson JSON Configuration
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=UTC
spring.jackson.default-property-inclusion=non_null

# Actuator
management.endpoints.enabled-by-default=true
management.endpoint.health.enabled=true

# Mail Configuration (override in environment-specific files if needed)
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
