# Base Application Configuration
spring.application.name=kasisira
app.frontend.url=http://localhost:3000
app.backend.url=http://localhost:8080

# Active Profile - Set via environment variable or JVM argument
# Example: java -jar -Dspring.profiles.active=production app.jar
# Or: export SPRING_PROFILES_ACTIVE=development
spring.profiles.active=${SPRING_PROFILES_ACTIVE:development}

# Common settings across all environments
server.servlet.context-path=/api

# Jackson JSON Configuration
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=UTC
spring.jackson.default-property-inclusion=non_null

# Actuator
management.endpoints.enabled-by-default=true
management.endpoint.health.enabled=true

# Mail Configuration (override in environment-specific files if needed)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${EMAIL_USERNAME}
spring.mail.password=${EMAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com

# Thymeleaf Configuration for Email Templates
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.cache=false

# JWT Configuration
app.jwt.secret=${JWT_SECRET}
app.jwt.access-token-expiration-ms=${ACCESS_TOKEN_EXPIRY_IN_MILLIS}
app.jwt.refresh-token-expiration-ms=${REFRESH_TOKEN_EXPIRY_IN_MILLIS}

# OAuth2 Google Configuration
spring.security.oauth2.client.registration.google.client-id=your-google-client-id
spring.security.oauth2.client.registration.google.client-secret=your-google-client-secret
spring.security.oauth2.client.registration.google.scope=profile,email
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}

