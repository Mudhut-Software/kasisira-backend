# Testing Environment Configuration

# Database Configuration - Use a separate test database
spring.datasource.url=jdbc:postgresql://localhost:5432/kasisira_test
spring.datasource.username=${TEST_DB_USERNAME}
spring.datasource.password=${TEST_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
# Run tests against the Flyway-migrated schema so any entity/migration drift
# fails fast in CI. ddl-auto is set to validate in application.properties.
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Flyway configuration inherited from application.properties (enabled, validate).

# Logging
logging.level.root=INFO
logging.level.com.mudhut.software.kasisira=DEBUG
logging.level.org.springframework.web=WARN
logging.level.org.springframework.test=DEBUG

# Test specific settings
spring.test.database.replace=none

# Actuator
management.endpoints.web.exposure.include=health

# Exclude Spring Boot's default security auto-config; our SecurityConfig
# class provides the filter chain. Security is still active in tests —
# unauthenticated requests return 401 via RestAuthenticationEntryPoint.
# Tests that need an authenticated principal must attach one explicitly
# via MockMvc's authentication() postprocessor.
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration
