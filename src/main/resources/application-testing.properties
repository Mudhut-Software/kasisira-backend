# Testing Environment Configuration

# Database Configuration - Use a separate test database
spring.datasource.url=jdbc:postgresql://localhost:5432/kasisira_test
spring.datasource.username=${TEST_DB_USERNAME}
spring.datasource.password=${TEST_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Flyway Configuration
spring.flyway.enabled=false

# Logging
logging.level.root=INFO
logging.level.com.mudhut.software.kasisira=DEBUG
logging.level.org.springframework.web=WARN
logging.level.org.springframework.test=DEBUG

# Test specific settings
spring.test.database.replace=none

# Actuator
management.endpoints.web.exposure.include=health

# Disable security for easier testing (override in specific tests if needed)
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration
