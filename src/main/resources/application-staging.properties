# Staging Environment Configuration

# Database Configuration
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:kasisira_staging}
spring.datasource.username=${STAGING_DB_USERNAME}
spring.datasource.password=${STAGING_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection Pool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000

# JPA/Hibernate Configuration
# ddl-auto is set to validate in application.properties; Flyway owns the schema.
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Flyway configuration inherited from application.properties.

# Logging
logging.level.root=INFO
logging.level.com.mudhut.software.kasisira=INFO
logging.level.org.springframework.web=INFO

# Actuator
management.endpoints.web.exposure.include=health,info,metrics,prometheus

# Security
server.error.include-message=never
server.error.include-stacktrace=never

# SMS provider
notifications.sms.provider=africas-talking
# Required env: AT_USERNAME, AT_API_KEY, AT_SENDER_ID
