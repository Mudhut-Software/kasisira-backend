# Production Environment Configuration

# Database Configuration - Use environment variables for security
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection Pool - Production settings
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# JPA/Hibernate Configuration - Never use ddl-auto=update in production.
# ddl-auto is set to validate in application.properties; Flyway owns the schema.
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# Flyway configuration inherited from application.properties. Production
# opts out of baseline-on-migrate so the first deploy that uses Flyway still
# has to be baselined explicitly (safety check against an unmigrated prod DB).
spring.flyway.baseline-on-migrate=false
spring.flyway.out-of-order=false

# Logging - Minimal logging in production
logging.level.root=WARN
logging.level.com.mudhut.software.kasisira=INFO
logging.level.org.springframework.web=WARN

# Actuator - Expose only essential endpoints
management.endpoints.web.exposure.include=health,metrics,prometheus
management.endpoint.health.show-details=never

# Security - Production hardening
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never

# Server Configuration
server.port=${PORT:8080}
server.compression.enabled=true
server.http2.enabled=true

# SSL/TLS (uncomment and configure if using SSL)
# server.ssl.enabled=true
# server.ssl.key-store=${SSL_KEY_STORE}
# server.ssl.key-store-password=${SSL_KEY_STORE_PASSWORD}
# server.ssl.key-store-type=PKCS12

# SMS provider
notifications.sms.provider=africas-talking
# Required env: AT_USERNAME, AT_API_KEY, AT_SENDER_ID
