name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: kasisira_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      SPRING_PROFILES_ACTIVE: testing
      TEST_DB_USERNAME: postgres
      TEST_DB_PASSWORD: postgres
      # Dummy values — tests never exercise real tokens/mail; Spring just needs
      # the placeholders in application.properties resolvable during context load.
      JWT_SECRET: ci-test-secret-that-is-at-least-256-bits-long-for-hs256-algorithm
      ACCESS_TOKEN_EXPIRY_IN_MILLIS: '3600000'
      REFRESH_TOKEN_EXPIRY_IN_MILLIS: '604800000'
      EMAIL_USERNAME: ci@example.com
      EMAIL_PASSWORD: ci-placeholder

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run tests
        run: ./gradlew test

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            build/reports/tests/test
            build/test-results/test
          retention-days: 7
